name: Forage
options:
  bundleIdPrefix: co.xanom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VTQW687WBQ
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Forage:
    type: application
    platform: iOS
    sources:
      - path: Forage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.forage
        PRODUCT_NAME: Forage
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Forage/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: SafariServices.framework
      - sdk: Network.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
    info:
      path: Forage/Info.plist
      properties:
        CFBundleDisplayName: Forage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # forage://reset?token=… (see App/DeepLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: co.xanom.forage
            CFBundleURLSchemes:
              - forage
        NSLocationWhenInUseUsageDescription: Forage uses your location to find places to eat near you.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - Newsreader-Regular.ttf
        # The base URL can point at a dev server on localhost (see README.md).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Default API base URL. Override at runtime with the `apiBaseURL` user default
        # (for example the launch argument `-apiBaseURL http://localhost:3000`).
        ForageBaseURL: https://forage.xanom.co

  ForageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ForageTests
    dependencies:
      - target: Forage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.forage.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Forage.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Forage

schemes:
  Forage:
    build:
      targets:
        Forage: all
        ForageTests: [test]
    test:
      gather_coverage_data: true
      coverage_targets:
        - Forage
      targets:
        - ForageTests
